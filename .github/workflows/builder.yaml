name: Builder

env:
  BUILD_ARGS: "--test"
  MONITORED_FILES: "build.yaml config.yaml Dockerfile rootfs"

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Get changed files
        id: changed_files
        uses: jitterbit/get-changed-files@b17fbb00bdc0c0f63fcf166580804b4d2cdc2a42 # v1

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@9e9565e68f5a70d874202871f4c4064d23814235 # master

      - name: Get changed add-ons
        id: changed_addons
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
        run: |
          changed_addons=()
          for addon in ${ADDONS}; do
            for file in ${MONITORED_FILES}; do
              # Match whole path components so one add-on name cannot match another
              if [[ "${CHANGED_FILES}" =~ (^|[[:space:]])${addon}/${file}([/[:space:]]|$) ]]; then
                changed_addons+=("\"${addon}\"")
                break
              fi
            done
          done

          if [[ ${#changed_addons[@]} -gt 0 ]]; then
            changed=$(IFS=,; echo "${changed_addons[*]}")
            echo "Changed add-ons: ${changed}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "addons=[${changed}]" >> "$GITHUB_OUTPUT"
          else
            echo "No add-on had any monitored files changed (${MONITORED_FILES})"
          fi

  build:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64", "amd64", "armhf", "armv7", "i386"]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@9e9565e68f5a70d874202871f4c4064d23814235 # master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          ARCHITECTURES: ${{ steps.info.outputs.architectures }}
          ARCH: ${{ matrix.arch }}
          ADDON: ${{ matrix.addon }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${IMAGE}" == "null" ]]; then
            echo "Image property is not defined, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          elif [[ "${ARCHITECTURES}" =~ ${ARCH} ]]; then
            echo "build_arch=true" >> "$GITHUB_OUTPUT"
            echo "image=$(echo "${IMAGE}" | cut -d'/' -f3)" >> "$GITHUB_OUTPUT"
            if [[ -z "${HEAD_REF}" ]] && [[ "${EVENT_NAME}" == "push" ]]; then
              echo "BUILD_ARGS=" >> "$GITHUB_ENV"
            fi
          else
            echo "${ARCH} is not a valid arch for ${ADDON}, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        if: env.BUILD_ARGS != '--test'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder@a60da4f9075353679f2d9f5d708526e2403144dd # 2024.08.2
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "${{ steps.check.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
name: Builder

env:
  MONITORED_FILES: "config.yaml Dockerfile rootfs"

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      matrix: ${{ steps.changed_addons.outputs.matrix }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          # New branches report an all-zero "before" SHA; fall back to the parent commit
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          files=$(git diff --name-only "${base}" HEAD | tr '\n' ' ')
          echo "Changed files: ${files}"
          echo "all=${files}" >> "$GITHUB_OUTPUT"

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@9e9565e68f5a70d874202871f4c4064d23814235 # master

      - name: Get changed add-ons
        id: changed_addons
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
          OWNER: ${{ github.repository_owner }}
        run: |
          changed_addons=()
          for addon in ${ADDONS}; do
            for file in ${MONITORED_FILES}; do
              # Match whole path components so one add-on name cannot match another
              if [[ "${CHANGED_FILES}" =~ (^|[[:space:]])${addon}/${file}([/[:space:]]|$) ]]; then
                changed_addons+=("${addon}")
                break
              fi
            done
          done

          if [[ ${#changed_addons[@]} -gt 0 ]]; then
            echo "Changed add-ons: ${changed_addons[*]}"
            owner="${OWNER,,}"
            matrix='{"include":[]}'
            for addon in "${changed_addons[@]}"; do
              for arch in amd64 aarch64; do
                case "${arch}" in
                  amd64) os="ubuntu-24.04" ;;
                  aarch64) os="ubuntu-24.04-arm" ;;
                esac
                matrix=$(jq -c --arg addon "${addon}" --arg arch "${arch}" --arg os "${os}" \
                  --arg image "ghcr.io/${owner}/${arch}-addon-${addon}" \
                  '.include += [{addon: $addon, arch: $arch, os: $os, image: $image}]' <<< "${matrix}")
              done
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          else
            echo "No add-on had any monitored files changed (${MONITORED_FILES})"
          fi

  build:
    needs: init
    if: needs.init.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write # needed for Cosign signing when publishing

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get add-on version
        id: version
        env:
          ADDON: ${{ matrix.addon }}
        run: |
          version=$(sed -n 's/^version: *//p' "${ADDON}/config.yaml" | head -n1 | tr -d "\"' ")
          if [[ -z "${version}" ]]; then
            echo "::error::Could not read version from ${ADDON}/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.addon }} add-on
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ matrix.addon }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ steps.version.outputs.version }}
            latest
          version: ${{ steps.version.outputs.version }}
          cache-gha-scope: ${{ matrix.addon }}-${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          # Only publish and sign from pushes to main; pull requests just build
          push: ${{ github.event_name == 'push' }}
          cosign: ${{ github.event_name == 'push' }}

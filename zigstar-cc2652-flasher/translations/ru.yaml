---
configuration:
  device:
    name: Устройство
    description: Выберите serial port к которому подключен ваш CC2652P координатор.
  network_device:
    name: Сетевое устройство
    description: IP адрес и порт вашего CC2652P координатор. IP_ADDRESS:PORT
  usb_mode:
    name: Сеть/USB
    description: Включить режим прошивки USB-устройства вместо сетевого (требуется активировать режим загрузчика, удерживая кнопку BSL при подключении к USB).
  sonoff:
    name: Координатор Sonoff USB ZBDongle P
    description: Включить режим прошивки Sonoff USB ZBDongle P, не подходит для Sonoff USB ZBDongle E
  launchpad_fw:
    name: Актуальная прошивка Koenkk - CC1352P2_CC2652P_launchpad_*.zip
    description: Будет загружена и установлена последняя прошивка Koenkk, CC1352P2_CC2652P_launchpad_*.zip
  cc1352p7_fw:
    name: Актуальная прошивка Koenkk - CC1352P7_coordinator_*.zip
    description: Будет загружена и установлена последняя прошивка Koenkk,CC1352P7_coordinator_*.zip. UZG-01 v0.2+!
  other_fw:
    name: Актуальная прошивка Koenkk - CC1352P2_CC2652P_other_*.zip
    description: Будет загружена и установлена последняя прошивка Koenkk,CC1352P2_CC2652P_other_*.zip. Ebyte
  firmware_url:
    name: Выбрать URL файла прошивки
    description: URL для другого варианта прошивки для вашего координатора. Убедитесь что это прямая ссылка raw на GitHub.
  trigger_bsl:
    name: Включить Bootloader mode для сетевого устройства
    description: Позволяет аддону запускать режим загрузчика на сетевых устройствах.
  write_ieee:
    name: Записать другой IEEE-адрес в устройство
    description: Включите и укажите нужный IEEE-адрес ниже
  ieee:
    name: IEEE-адрес
    description: Нужный IEEE-адрес в формате 00:12:4b:aa:bb:cc:dd:ee
  baudrate:
    name: Скорость порта
    description: Скорость последовательного порта для связи с загрузчиком. Оставьте пустым для значения по умолчанию (500000). Для модулей, подключённых напрямую к UART, используйте 115200.
